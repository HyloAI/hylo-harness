[project]
name = "wc-policy-openpi"
version = "0.1.0.dev0"
description = "worldcurrent adapter that drives an openpi policy server (pi0, pi0-FAST, pi0.5) over its websocket protocol"
requires-python = ">=3.10"
dependencies = ["wc-core", "websockets>=13", "pillow>=10"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldcurrent"]

[project.entry-points."worldcurrent.agents"]
"openpi" = "worldcurrent.policies.openpi.agent:OpenPIAgent"

[tool.uv.sources]
wc-core = { workspace = true }

[project.entry-points."worldcurrent.meta"]
"wc-policy-openpi" = "worldcurrent.policies.openpi:META"
