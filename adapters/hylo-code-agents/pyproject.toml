[project]
name = "hylo-code-agents"
version = "0.1.0.dev0"
description = "Hylo tool-using agents: code-writing agents (code.llm, code.program), research sessions and program candidates, program skills"
requires-python = ">=3.10"
dependencies = ["hylo-core", "hylo-agents", "hylo-manip", "hylo-eval", "hylo-evolve", "hylo-memory", "hylo-reasoner-llm",
                "hylo-tools", "numpy>=1.26", "pyyaml>=6"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hylo"]

[project.entry-points."hylo.agents"]
"code.llm" = "hylo.codeagents.agents:CodeLLMAgent"
"code.program" = "hylo.codeagents.agents:CodeProgramAgent"
"tools.llm" = "hylo.codeagents.tool_agent:ToolLLMAgent"

[project.entry-points."hylo.generators"]
"research.llm" = "hylo.codeagents.generator:ResearchProposer"

[project.entry-points."hylo.commands"]
research = "hylo.codeagents.cli:research"
scene = "hylo.codeagents.scenes:scene_command"
motion = "hylo.codeagents.motion:motion_command"
replay = "hylo.codeagents.replay:replay_command"
watch = "hylo.codeagents.watch:main"
preflight = "hylo.codeagents.preflight:main"
world = "hylo.codeagents.session:main"
mcp = "hylo.codeagents.mcp:main"
roles = "hylo.codeagents.roles:main"
chats = "hylo.codeagents.chats:main"

[tool.uv.sources]
hylo-core = { workspace = true }
hylo-agents = { workspace = true }
hylo-manip = { workspace = true }
hylo-eval = { workspace = true }
hylo-evolve = { workspace = true }
hylo-memory = { workspace = true }
hylo-reasoner-llm = { workspace = true }
hylo-tools = { workspace = true }

[project.entry-points."hylo.meta"]
"hylo-code-agents" = "hylo.codeagents:META"
