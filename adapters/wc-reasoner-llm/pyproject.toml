[project]
name = "wc-reasoner-llm"
version = "0.1.0.dev0"
description = "worldcurrent LLM/VLM runtime components: client, planner, object choosers, VLM success judge (Ollama native or OpenAI-compatible endpoints)"
requires-python = ">=3.10"
dependencies = ["wc-core", "wc-agents", "pillow>=10"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldcurrent"]

[project.entry-points."worldcurrent.reasoners"]
"chooser.llm" = "worldcurrent.reasoners.llm.chooser:LLMChooser"
"chooser.vlm" = "worldcurrent.reasoners.llm.vlm_chooser:VLMChooser"
"planner.llm" = "worldcurrent.reasoners.llm.planner:LLMSubgoalPlanner"

[project.entry-points."worldcurrent.instruments"]
"judge.vlm" = "worldcurrent.reasoners.llm.judge:VLMSuccessJudge"

[tool.uv.sources]
wc-core = { workspace = true }
wc-agents = { workspace = true }

[project.entry-points."worldcurrent.meta"]
"wc-reasoner-llm" = "worldcurrent.reasoners.llm:META"
