[project]
name = "hylo-policy-simplememvla"
version = "0.1.0.dev0"
description = "Optional frozen SimpleMemVLA agent with Hylo-owned streaming video memory"
requires-python = ">=3.10"
dependencies = ["hylo-core", "hylo-memory", "numpy>=1.24"]
license = "Apache-2.0"

[project.optional-dependencies]
inference = ["torch==2.9.1", "transformers==5.11.0", "safetensors==0.7.0", "numpy>=1.26,<2", "pillow>=10"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hylo"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "hylo/policies/simplememvla/THIRD_PARTY_NOTICES.md"

[project.entry-points."hylo.agents"]
simplememvla = "hylo.policies.simplememvla.agent:SimpleMemVLAAgent"

[project.entry-points."hylo.meta"]
hylo-policy-simplememvla = "hylo.policies.simplememvla:META"

[tool.uv.sources]
hylo-core = { workspace = true }
hylo-memory = { workspace = true }
