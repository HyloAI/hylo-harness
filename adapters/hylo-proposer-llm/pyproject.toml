[project]
name = "hylo-proposer-llm"
version = "0.1.0.dev0"
description = "Hylo self-improvement with an LLM: steering-candidate proposer and lesson reflector (evolve time, never in the control loop)"
requires-python = ">=3.10"
dependencies = ["hylo-core", "hylo-agents", "hylo-evolve", "hylo-reasoner-llm"]
license = "Apache-2.0"

[project.entry-points."hylo.generators"]
"llm.steering" = "hylo.proposers.llm.proposer:LLMSteeringProposer"

[project.entry-points."hylo.reflectors"]
"llm.reflector" = "hylo.proposers.llm.reflector:LLMReflector"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hylo"]

[tool.uv.sources]
hylo-core = { workspace = true }
hylo-agents = { workspace = true }
hylo-evolve = { workspace = true }
hylo-reasoner-llm = { workspace = true }

[project.entry-points."hylo.meta"]
"hylo-proposer-llm" = "hylo.proposers.llm:META"
