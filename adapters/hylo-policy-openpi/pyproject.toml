[project]
name = "hylo-policy-openpi"
version = "0.1.0.dev0"
description = "Hylo adapter that drives an openpi policy server (pi0, pi0-FAST, pi0.5) over its websocket protocol"
requires-python = ">=3.10"
dependencies = ["hylo-core", "websockets>=13", "pillow>=10"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hylo"]

[project.entry-points."hylo.agents"]
"openpi" = "hylo.policies.openpi.agent:OpenPIAgent"

[tool.uv.sources]
hylo-core = { workspace = true }

[project.entry-points."hylo.meta"]
"hylo-policy-openpi" = "hylo.policies.openpi:META"
