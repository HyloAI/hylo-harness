[project]
name = "wc-policy-lerobot"
version = "0.1.0.dev0"
description = "worldcurrent adapter that runs LeRobot policies (SmolVLA, pi0, ...) as Agents, usually behind an AgentServer"
requires-python = ">=3.10"
dependencies = ["wc-core", "wc-agents", "wc-memory"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldcurrent"]

[project.entry-points."worldcurrent.policies"]
"lerobot" = "worldcurrent.policies.lerobot.agent:LeRobotAgent"          # any LeRobot policy as a chunk sampler

[project.entry-points."worldcurrent.agents"]
"lerobot" = "worldcurrent.policies.lerobot.agent:LeRobotAgent"
"lerobot.steered" = "worldcurrent.policies.lerobot.agent:make_steered"
"lerobot.critic_steered" = "worldcurrent.policies.lerobot.critic_agent:make_critic_steered"
"lerobot.memory_steered" = "worldcurrent.policies.lerobot.experience_agent:make_experience_agent"
"lerobot.noise_steered" = "worldcurrent.policies.lerobot.experience_agent:make_noise_agent"

[project.entry-points."worldcurrent.datasources"]
"lerobot.dataset" = "worldcurrent.policies.lerobot.ingest:LeRobotDatasetSource"

[project.entry-points."worldcurrent.learners"]
"lerobot.expert_iteration" = "worldcurrent.policies.lerobot.selftrain:ExpertIterationLearner"
"lerobot.action_memory" = "worldcurrent.policies.lerobot.memory_build:ActionMemoryLearner"
"lerobot.noise_prior" = "worldcurrent.policies.lerobot.memory_build:NoisePriorLearner"

[tool.uv.sources]
wc-core = { workspace = true }
wc-agents = { workspace = true }
wc-memory = { workspace = true }

[project.entry-points."worldcurrent.meta"]
"wc-policy-lerobot" = "worldcurrent.policies.lerobot:META"
