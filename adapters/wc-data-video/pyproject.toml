[project]
name = "wc-data-video"
version = "0.1.0.dev0"
description = "worldcurrent external data sources: folders of image sequences and video files (no action labels)"
requires-python = ">=3.10"
dependencies = ["wc-core", "pillow>=10", "imageio>=2.30"]
license = "Apache-2.0"

[project.optional-dependencies]
ffmpeg = ["imageio-ffmpeg>=0.5"]

[project.entry-points."worldcurrent.datasources"]
"video.frames" = "worldcurrent.datasources.video.sources:FrameFolderSource"
"video.files" = "worldcurrent.datasources.video.sources:VideoFileSource"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldcurrent"]

[tool.uv.sources]
wc-core = { workspace = true }

[project.entry-points."worldcurrent.meta"]
"wc-data-video" = "worldcurrent.datasources.video:META"
