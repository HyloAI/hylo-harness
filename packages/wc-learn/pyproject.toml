[project]
name = "wc-learn"
version = "0.1.0.dev0"
description = "worldcurrent learning pipeline: learner jobs, instrument calibration and labelling, external data ingestion, learners for runtime components"
requires-python = ">=3.10"
dependencies = ["wc-core", "wc-eval", "wc-agents", "numpy>=1.24"]
license = "Apache-2.0"

[project.entry-points."worldcurrent.learners"]
"critic.chunk_value" = "worldcurrent.learn.critic:CriticLearner"
"judge.trace" = "worldcurrent.learn.judges:TraceJudgeLearner"
"world_model.state" = "worldcurrent.learn.world_model:StateWorldModelLearner"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldcurrent"]

[tool.uv.sources]
wc-core = { workspace = true }
wc-eval = { workspace = true }
wc-agents = { workspace = true }

[project.entry-points."worldcurrent.meta"]
"wc-learn" = "worldcurrent.learn:META"
