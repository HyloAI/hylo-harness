[project]
name = "wc-eval"
version = "0.1.0.dev0"
description = "worldcurrent evaluation engine: benchmark contract and splits, scorers, paired statistics and gate tests, evaluation runner, experiments"
requires-python = ">=3.10"
dependencies = ["wc-core"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldcurrent"]

[project.entry-points."worldcurrent.benchmarks"]
"testing/reach-v0" = "worldcurrent.eval.builtin:testing_benchmark"

[project.entry-points."worldcurrent.scorers"]
"success" = "worldcurrent.eval.scoring:SuccessScorer"
"safety_interventions" = "worldcurrent.eval.scoring:SafetyInterventionScorer"
"steps" = "worldcurrent.eval.scoring:StepsScorer"

[project.entry-points."worldcurrent.gate_tests"]
"mcnemar" = "worldcurrent.eval.stats:McNemar"
"sign" = "worldcurrent.eval.stats:SignTest"
"paired_permutation" = "worldcurrent.eval.stats:PairedPermutation"

[tool.uv.sources]
wc-core = { workspace = true }

[project.entry-points."worldcurrent.meta"]
"wc-eval" = "worldcurrent.eval:META"
