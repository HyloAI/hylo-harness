[project]
name = "hylo-evolve"
version = "0.1.0.dev0"
description = "Hylo evolution layer: diagnosis, candidates, validation gate, registry"
requires-python = ">=3.10"
dependencies = ["hylo-core", "hylo-eval", "hylo-learn"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hylo"]

[project.entry-points."hylo.generators"]
"rule.gain" = "hylo.evolve.loop:GainProposer"
"rule.steering" = "hylo.evolve.steering:SteeringRuleProposer"
"experience" = "hylo.evolve.experience:ExperienceProposer"
"critic.chunk_value" = "hylo.evolve.critic:CriticProposer"
"selftrain.expert_iteration" = "hylo.evolve.selftrain:ExpertIterationProposer"
"learn" = "hylo.evolve.learning:LearningProposer"

[tool.uv.sources]
hylo-core = { workspace = true }
hylo-eval = { workspace = true }
hylo-learn = { workspace = true }

[project.entry-points."hylo.meta"]
"hylo-evolve" = "hylo.evolve:META"
