[project]
name = "wc-agents"
version = "0.1.0.dev0"
description = "worldcurrent intelligence layer: agent composition, reasoners, baseline agents"
requires-python = ">=3.10"
dependencies = ["wc-core"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldcurrent"]

[project.entry-points."worldcurrent.envs"]
"world_model" = "worldcurrent.agents.world_model:WorldModelEnvironment"

[project.entry-points."worldcurrent.agents"]
"testing.p_controller" = "worldcurrent.agents.baseline:PControllerAgent"
"baseline.planar_ik" = "worldcurrent.agents.baseline:PlanarIKAgent"
"baseline.random" = "worldcurrent.agents.baseline:RandomAgent"
"testing.landmark" = "worldcurrent.agents.composable:make_landmark_agent"
"steered" = "worldcurrent.agents.steering:SteeredAgent"
"policy" = "worldcurrent.agents.policy_agents:PolicyAgent"
"temporal_ensemble" = "worldcurrent.agents.policy_agents:TemporalEnsembleAgent"
"planner.subgoal" = "worldcurrent.agents.planner:SubgoalAgent"
"skills" = "worldcurrent.agents.skills:SkillAgent"
"memory.steered" = "worldcurrent.agents.memory_steer:MemorySteeredAgent"
"noise.steered" = "worldcurrent.agents.noise_steer:NoiseSteeredAgent"
"shadow" = "worldcurrent.agents.shadow:ShadowAgent"
"composable.object_reach" = "worldcurrent.agents.composable:make_object_reach_agent"
"baseline.nearest_object" = "worldcurrent.agents.baseline:NearestObjectAgent"

[project.entry-points."worldcurrent.reasoners"]
"testing.rule_landmark" = "worldcurrent.agents.reasoner:LandmarkReasoner"
"chooser.rule_color" = "worldcurrent.agents.object_reasoner:RuleColorChooser"
"planner.identity" = "worldcurrent.agents.planner:IdentityPlanner"

[project.entry-points."worldcurrent.instruments"]
"judge.trace" = "worldcurrent.agents.judges:TraceSuccessJudge"

[tool.uv.sources]
wc-core = { workspace = true }

[project.entry-points."worldcurrent.meta"]
"wc-agents" = "worldcurrent.agents:META"
