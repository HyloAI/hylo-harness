[project]
name = "wc-memory"
version = "0.1.0.dev0"
description = "worldcurrent memory layer: episodic/spatial stores, action memory, lessons, skills"
requires-python = ">=3.10"
dependencies = ["wc-core"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldcurrent"]

[project.entry-points."worldcurrent.memory"]
"sqlite" = "worldcurrent.memory.sqlite:SQLiteMemoryStore"
"action_bank" = "worldcurrent.memory.action_bank:ActionBank"
"skill_library" = "worldcurrent.memory.skills:SkillLibrary"
"lesson_book" = "worldcurrent.memory.lessons:LessonBook"

[tool.uv.sources]
wc-core = { workspace = true }

[project.entry-points."worldcurrent.meta"]
"wc-memory" = "worldcurrent.memory:META"
