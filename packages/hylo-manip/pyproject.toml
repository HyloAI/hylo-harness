[project]
name = "hylo-manip"
version = "0.1.0.dev0"
description = "Hylo manipulation toolkit: perception, kinematics, grasping and motion planning tools for tool-using agents"
requires-python = ">=3.10"
dependencies = ["hylo-core", "numpy>=1.26", "scipy>=1.10", "mujoco>=3.1"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hylo"]

[tool.uv.sources]
hylo-core = { workspace = true }

[project.entry-points."hylo.meta"]
"hylo-manip" = "hylo.manip:META"
