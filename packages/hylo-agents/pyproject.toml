[project]
name = "hylo-agents"
version = "0.1.0.dev0"
description = "Hylo decision-making: agent composition, steering, planning, skills, baseline agents"
requires-python = ">=3.10"
dependencies = ["hylo-core"]
license = "Apache-2.0"

[project.optional-dependencies]
# imported only when such an agent is built, so a robot computer can install decision-making alone
critic = ["hylo-instruments"]     # CriticSteeredAgent loads a hylo.instruments.critic.ChunkCritic
rules = ["hylo-reasoners"]        # composable.object_reach / testing.landmark use the rule-based reasoners

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hylo"]

[project.entry-points."hylo.agents"]
"testing.p_controller" = "hylo.agents.baseline:PControllerAgent"
"baseline.planar_ik" = "hylo.agents.baseline:PlanarIKAgent"
"baseline.random" = "hylo.agents.baseline:RandomAgent"
"testing.landmark" = "hylo.agents.composable:make_landmark_agent"
"steered" = "hylo.agents.steering:SteeredAgent"
"policy" = "hylo.agents.policy_agents:PolicyAgent"
"temporal_ensemble" = "hylo.agents.policy_agents:TemporalEnsembleAgent"
"planner.subgoal" = "hylo.agents.planner:SubgoalAgent"
"skills" = "hylo.agents.skills:SkillAgent"
"memory.steered" = "hylo.agents.memory_steer:MemorySteeredAgent"
"noise.steered" = "hylo.agents.noise_steer:NoiseSteeredAgent"
"shadow" = "hylo.agents.shadow:ShadowAgent"
"composable.object_reach" = "hylo.agents.composable:make_object_reach_agent"
"baseline.nearest_object" = "hylo.agents.baseline:NearestObjectAgent"

[project.entry-points."hylo.planners"]
"planner.identity" = "hylo.agents.planner:IdentityPlanner"

[tool.uv.sources]
hylo-core = { workspace = true }
hylo-instruments = { workspace = true }
hylo-reasoners = { workspace = true }

[project.entry-points."hylo.meta"]
"hylo-agents" = "hylo.agents:META"
