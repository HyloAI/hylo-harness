[project]
name = "hylo-memory"
version = "0.1.0.dev0"
description = "Hylo memory layer: episodic/spatial stores, action memory, lessons, skills"
requires-python = ">=3.10"
dependencies = ["hylo-core"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hylo"]

[project.entry-points."hylo.memory"]
"sqlite" = "hylo.memory.sqlite:SQLiteMemoryStore"
"action_bank" = "hylo.memory.action_bank:ActionBank"
"skill_library" = "hylo.memory.skills:SkillLibrary"
"lesson_book" = "hylo.memory.lessons:LessonBook"

[tool.uv.sources]
hylo-core = { workspace = true }

[project.entry-points."hylo.meta"]
"hylo-memory" = "hylo.memory:META"
