[project]
name = "wc-catalog"
version = "0.1.0.dev0"
description = "worldcurrent catalog: a read-only query API over the runs directory (runs, episode timelines and frames, paired comparisons, campaigns, artifacts, skills, lessons, memories)"
requires-python = ">=3.10"
dependencies = ["wc-core", "wc-eval", "numpy>=1.24"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldcurrent"]

[tool.uv.sources]
wc-core = { workspace = true }
wc-eval = { workspace = true }
