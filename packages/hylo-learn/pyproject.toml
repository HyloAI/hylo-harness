[project]
name = "hylo-learn"
version = "0.1.0.dev0"
description = "Hylo learning pipeline: learner jobs, instrument calibration and labelling, external data ingestion, learners for runtime components"
requires-python = ">=3.10"
dependencies = ["hylo-core", "hylo-eval", "hylo-agents", "numpy>=1.24"]
license = "Apache-2.0"

[project.entry-points."hylo.learners"]
"critic.chunk_value" = "hylo.learn.critic:CriticLearner"
"judge.trace" = "hylo.learn.judges:TraceJudgeLearner"
"world_model.state" = "hylo.learn.world_model:StateWorldModelLearner"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hylo"]

[tool.uv.sources]
hylo-core = { workspace = true }
hylo-eval = { workspace = true }
hylo-agents = { workspace = true }

[project.entry-points."hylo.meta"]
"hylo-learn" = "hylo.learn:META"
