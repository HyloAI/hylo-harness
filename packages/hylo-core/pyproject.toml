[project]
name = "hylo-core"
version = "0.1.0.dev0"
description = "Hylo core: contracts, kernel, safety shield, events, trace, registry, config, remote env protocol"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pydantic>=2.7", "pyyaml>=6", "websockets>=13", "msgpack>=1.0"]
license = "Apache-2.0"

[project.scripts]
hylo = "hylo.core.cli:main"

[project.entry-points."hylo.commands"]
profile = "hylo.core.profile:main"
store = "hylo.core.store:main"
seal = "hylo.core.seal:main"
stage = "hylo.core.stage_cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hylo"]

[project.entry-points."hylo.envs"]
"testing.point_reach" = "hylo.testing.point_reach:PointReachEnv"
"remote.ws" = "hylo.core.remote.ws:WSEnvironment"

[project.entry-points."hylo.guards"]
"delta_limit" = "hylo.core.safety:DeltaLimitGuard"
"workspace" = "hylo.core.safety:workspace_guard"
"norm_limit" = "hylo.core.safety:NormLimitGuard"
"keep_out" = "hylo.core.safety:KeepOutGuard"

[project.entry-points."hylo.learners"]
"testing.summary" = "hylo.testing.learners:SummaryLearner"

[project.entry-points."hylo.agents"]
"remote" = "hylo.core.remote.agent_client:RemoteAgent"
"remote.ws" = "hylo.core.remote.ws:WSAgent"

[project.entry-points."hylo.meta"]
"hylo-core" = "hylo.core:META"
